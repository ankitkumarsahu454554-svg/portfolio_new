<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Obsidian dark container -->
  <rect width="64" height="64" rx="14" fill="#090A0F"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Subtle technical marks -->
  <line x1="32" y1="6" x2="32" y2="12" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="58" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="12" y2="32" stroke="rgba(99,102,241,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="58" y2="32" stroke="rgba(99,102,241,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Orbiting rings -->
  <circle cx="32" cy="32" r="22" stroke="rgba(56,189,248,0.2)" stroke-width="1" stroke-dasharray="3 3"/>
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="url(#azureIndigoGrad)" stroke-width="1.5" transform="rotate(-25 32 32)"/>
  
  <!-- Central node -->
  <circle cx="32" cy="32" r="11" fill="url(#coreGrad)"/>
  <circle cx="28" cy="28" r="3.5" fill="#38BDF8"/>
  <circle cx="36" cy="36" r="2" fill="#818CF8" opacity="0.8"/>
  
  <defs>
    <linearGradient id="coreGrad" x1="22" y1="22" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="azureIndigoGrad" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
</svg>
