<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background container -->
  <rect width="64" height="64" rx="14" fill="#08090B"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Subtle tech crosshair lines -->
  <line x1="32" y1="6" x2="32" y2="12" stroke="rgba(199,255,85,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="58" stroke="rgba(199,255,85,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="12" y2="32" stroke="rgba(0,240,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="58" y2="32" stroke="rgba(0,240,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Orbiting stylized metallic rings -->
  <circle cx="32" cy="32" r="22" stroke="rgba(0,240,255,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="url(#electricGrad)" stroke-width="1.5" transform="rotate(-25 32 32)"/>
  
  <!-- Liquid metallic core droplet with lime reflection -->
  <circle cx="32" cy="32" r="11" fill="url(#metalGrad)"/>
  <circle cx="28" cy="28" r="3.5" fill="#C7FF55"/>
  <circle cx="36" cy="36" r="2" fill="#00F0FF" opacity="0.8"/>
  
  <defs>
    <linearGradient id="metalGrad" x1="22" y1="22" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="electricGrad" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7FF55"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#C7FF55"/>
    </linearGradient>
  </defs>
</svg>

