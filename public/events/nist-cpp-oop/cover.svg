<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#0a1124"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Outer Framing -->
  <rect x="20" y="20" width="760" height="410" rx="16" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  
  <!-- Corner telemetry marks -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 750 20 L 780 20 L 780 50" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 20 400 L 20 430 L 50 430" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 750 430 L 780 430 L 780 400" fill="none" stroke="#00F0FF" stroke-width="3"/>
  
  <!-- Center graphic badge -->
  <circle cx="400" cy="190" r="45" fill="rgba(0,240,255,0.08)" stroke="#00F0FF" stroke-width="2"/>
  <text x="400" y="198" font-family="monospace" font-size="24" font-weight="bold" fill="#00F0FF" text-anchor="middle">MC</text>
  
  <!-- Title and Subtitle -->
  <text x="400" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="-0.5">NIST OOP with C++</text>
  <text x="400" y="300" font-family="monospace" font-size="13" fill="#8493A8" text-anchor="middle" letter-spacing="1">OBJECT ORIENTED PROGRAMMING IN C++</text>
  
  <!-- File drop hint -->
  <rect x="210" y="330" width="380" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="400" y="350" font-family="monospace" font-size="10" fill="#00F0FF" text-anchor="middle" letter-spacing="1">[ DROP ASSET HERE // cover.svg ]</text>
</svg>